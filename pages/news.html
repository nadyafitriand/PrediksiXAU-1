<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Economic News - GoldVision</title><link rel="stylesheet" href="../style.css"><style>.news-table{width:100%;border-collapse:collapse}.news-table th,.news-table td{padding:13px 10px;text-align:left;border-bottom:1px solid var(--line);font-size:12px}.news-table th{color:var(--muted);font-size:10px;text-transform:uppercase}.search{width:100%;border:1px solid var(--line);border-radius:8px;padding:11px 12px;margin-bottom:16px;font-size:12px}</style></head><body><aside class="sidebar"><div class="brand"><div class="brand-icon">G</div><div><h2>GoldVision</h2><span>Trading Decision Support</span></div></div><nav><a href="../index.html">Dashboard</a><a href="forecast.html">Forecast</a><a href="sentiment.html">Sentiment</a><a class="active" href="news.html">Economic News</a></nav><div class="sidebar-note"><span>MODEL</span><strong>XGBoost + FinBERT</strong><small>Decision support, not financial advice.</small></div></aside><main class="main"><header class="topbar"><div><p class="eyebrow">NEWS DATA</p><h1>Economic News</h1><p class="subtitle">Berita ekonomi yang diproses oleh FinBERT.</p></div></header><section class="card"><input id="search" class="search" placeholder="Cari headline..."><div style="overflow-x:auto"><table class="news-table"><thead><tr><th>Time</th><th>Headline</th><th>Source</th><th>Sentiment</th></tr></thead><tbody id="newsBody"></tbody></table></div></section></main><script src="../data/mock-data.js"></script><script>const body=document.getElementById("newsBody"),search=document.getElementById("search");function render(){const q=search.value.toLowerCase();body.innerHTML=GOLD_DATA.news.filter(n=>n.title.toLowerCase().includes(q)).map(n=>`<tr><td>${n.time}</td><td>${n.title}</td><td>${n.source}</td><td class="sentiment ${n.sentiment}">${n.sentiment}</td></tr>`).join("")}search.addEventListener("input",render);render();</script></body></html>
